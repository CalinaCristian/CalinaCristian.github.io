# GitHub Pages (Jekyll): publish only what the site and the game load.
# Dev tooling, QA reports, research notes and specs stay in the repo but are not deployed.
exclude:
  - game/dev
  - game/research
  - specs
  - tools
  - package.json
  - README.md
  # Large internal diagnostics remain in Git, outside the published site.
  # Public native activity proofs under tourist-context-activities stay available.
  - handoffs/fidelity/integration-final-acceptance
  - handoffs/fidelity/us-districts
  - handoffs/fidelity/source-controlled-crossing
  # Latest public surveys only; original archived source stays in Git history.
  - game/overview/comparison-data/floreasca/historical
  - game/overview/comparison-data/romana/historical
  - game/overview/comparison-data/grozavesti/historical
  - game/overview/comparison-data/otopeni/historical
  - game/overview/comparison-data/seatac/historical
  - game/overview/comparison-data/unirii/historical
  - game/overview/comparison-data/pipera/historical
  - game/overview/comparison-data/bellevue/historical
