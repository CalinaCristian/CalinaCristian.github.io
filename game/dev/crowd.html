<!doctype html><html><head><meta charset="utf-8"><title>Crowd model check</title><style>html,body{margin:0;background:#556}canvas{display:block}</style></head><body>
<script type="module">
// dev: close-up of the crowd person model (outfits, coats, props) — ?n=6&coat=1&night=0
import * as THREE from '../vendor/three.module.min.js';
import { makeCrowd, dressFor, CROWD_FLAGS } from '../src/crowd.js';
const q = new URLSearchParams(location.search), N = +(q.get('n') || 6);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.setPixelRatio(1); document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#8fa3b8');
scene.add(new THREE.HemisphereLight('#dfe8f5', '#4a4038', 1.2)); const sun = new THREE.DirectionalLight('#fff4e0', 2.2); sun.position.set(3, 6, 4); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: '#6b6560' })); ground.rotation.x = -Math.PI / 2; scene.add(ground);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100); cam.position.set(0, 1.4, 4.2); cam.lookAt(0, 1.0, 0);
let seed = 7; const rng = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const crowd = makeCrowd({ max: N, city: q.get('city') || 'bucharest', season: q.get('season') || 'winter', rng, castShadow: false }); scene.add(crowd.object);
for (let i = 0; i < N; i++) { const o = dressFor(q.get('city') || 'bucharest', q.get('season') || 'winter', null, rng); if (q.get('coat') === '1') o.flags |= CROWD_FLAGS.coat; crowd.dress(i, o); crowd.set(i, { x: (i - (N - 1) / 2) * 0.9, z: 0, yaw: Math.PI + (+(q.get('yaw') || 0)), pose: q.get('pose') || 0, prop: q.get('prop') || undefined }); }
const tick = () => { crowd.update?.(1 / 60, cam); r.render(scene, cam); }; for (let k = 0; k < 3; k++) tick(); window.ready = true;
</script></body></html>
