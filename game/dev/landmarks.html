<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Landmark viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #a9c9e6; overflow: hidden; font: 13px/1.3 system-ui, sans-serif; }
  #ui { position: fixed; left: 8px; top: 8px; background: rgba(255,255,255,.85); padding: 6px 8px; border-radius: 6px; }
  #info { position: fixed; left: 8px; bottom: 8px; background: rgba(255,255,255,.85); padding: 4px 8px; border-radius: 6px; }
</style>
</head>
<body>
<div id="ui"><select id="sel"></select> <label><input type="checkbox" id="top"> top</label> <label><input type="checkbox" id="col"> collision</label></div>
<div id="info"></div>
<script type="module">
import * as THREE from '../vendor/three.module.min.js';
import { LANDMARKS, buildLandmark } from '../src/landmarks.js';

// Dev viewer: ?id=<landmark id>&view=top|34|street&az=<deg>&el=<deg>&d=<distance m>&fov=<deg>&ty=<look-at height m>
//   Seattle models are shown at real 1:1 scale (district mode, buildLandmark realScale); &legacy=1 shows the old x/z-squashed build.
//   &tx=&tz= aim at a model point; &ex=&ez=&ey= put a street-level camera at that exact model point (looking at tx/tz, ty).
//   &with=id1,id2 also places those landmarks around the selected one at their real lat/lon offsets (e.g. the whole
//   Lincoln Square complex: ?id=lincoln&with=onelincoln,lincolnsouth,bellevuesq).
//   view=street puts the camera at driver eye height (1.3 m) at distance d (default 1.6 x radius) from the
//   model centre (or &tx=&tz=), looking towards it; az is the bearing of the camera from the centre (0 = south/+z, 90 = east/+x).
//   &night=1: dark sky, moonlight only, night-lit materials (userData.nightEmissive, e.g. floodlit monuments) at full night;
//   &flood=0 builds without the floodlight material (ctx.floodlit = false).
const qs = new URLSearchParams(location.search);
if (qs.get('clean') === '1') document.head.insertAdjacentHTML('beforeend', '<style>#ui,#info{display:none}</style>');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);
if (new URLSearchParams(location.search).get('night') === '1') renderer.toneMapping = THREE.AgXToneMapping;   // like render.js
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#a9c9e6');
const NIGHT = qs.get('night') === '1';
if (NIGHT) scene.background = new THREE.Color('#0c1424');
scene.add(new THREE.HemisphereLight(NIGHT ? '#3a4a6a' : '#dfeeff', NIGHT ? '#1a1a1a' : '#7a7466', NIGHT ? 0.35 : 1.1));
const sun = new THREE.DirectionalLight(NIGHT ? '#9fb2d8' : '#fff6e8', NIGHT ? 0.25 : 2.2);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
scene.add(sun, sun.target);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshLambertMaterial({ color: '#9aa58c' }));
if (NIGHT) ground.material.color.set('#3c4038');
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
let camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 2e6);

const sel = document.getElementById('sel');
for (const l of LANDMARKS) sel.add(new Option(`${l.city.slice(0, 3)} · ${l.name}`, l.id));
let current = null, colGroup = null, extras = [];

function show(id) {
  const lm = LANDMARKS.find(l => l.id === id) || LANDMARKS[0];
  sel.value = lm.id;
  if (current) scene.remove(current.mesh);
  for (const e of extras) scene.remove(e); extras = [];
  if (colGroup) scene.remove(colGroup);
  const t0 = performance.now();
  current = buildLandmark(lm, { THREE, realScale: qs.get('legacy') !== '1', floodlit: qs.get('flood') !== '0' });
  const ms = performance.now() - t0;
  if (qs.get('norot') === '1') current.mesh.rotation.y = 0;
  scene.add(current.mesh);
  let extraTris = 0;
  for (const id2 of (qs.get('with') || '').split(',').filter(Boolean)) {
    const l2 = LANDMARKS.find(l => l.id === id2); if (!l2) continue;
    const r2 = buildLandmark(l2, { THREE, realScale: qs.get('legacy') !== '1' });
    const mLon = 111320 * Math.cos(lm.lat * Math.PI / 180), k = l2.city === 'seattle' && qs.get('legacy') === '1' ? 0.5 : 1;
    r2.mesh.position.set((l2.lon - lm.lon) * mLon * k, 0, -(l2.lat - lm.lat) * 111132 * k);
    scene.add(r2.mesh); extras.push(r2.mesh); extraTris += r2.triangles;
  }
  // collision overlay
  colGroup = new THREE.Group();
  for (const c of current.collision) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(c.hw * 2, 2, c.hd * 2), new THREE.MeshBasicMaterial({ color: '#ff2a2a', wireframe: true }));
    m.position.set(c.x, 1, c.z); m.rotation.y = c.angle; colGroup.add(m);
  }
  colGroup.visible = document.getElementById('col').checked || qs.get('col') === '1';
  scene.add(colGroup);
  // frame
  const box = new THREE.Box3().setFromObject(current.mesh), size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
  if (qs.get('tx') !== null) ctr.x = +qs.get('tx');   // &tx=&tz= : aim at this world point instead of the bbox centre
  if (qs.get('tz') !== null) ctr.z = +qs.get('tz');
  const R = Math.max(size.x, size.z, size.y * 1.15) * 0.5 + 1;
  ground.scale.set(R * 40, R * 40, 1);
  const top = document.getElementById('top').checked || qs.get('view') === 'top';
  if (top) {
    // A model study, not a georeferenced aerial comparison: square ground coverage,
    // x east / screen up north, independent of the landmark's authored yaw.
    const span = +(qs.get('span') ?? Math.max(size.x, size.z) * 1.16 + 4);
    camera = new THREE.OrthographicCamera(-span * (innerWidth / innerHeight) / 2, span * (innerWidth / innerHeight) / 2, span / 2, -span / 2, 0.5, 2e6);
    camera.position.set(ctr.x, Math.max(100, size.y + span), ctr.z);
    camera.up.set(0, 0, -1); camera.lookAt(ctr.x, 0, ctr.z);
  } else if (!camera.isPerspectiveCamera) camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 2e6);
  const street = !top && qs.get('view') === 'street';
  const az = THREE.MathUtils.degToRad(+(qs.get('az') ?? 35));
  camera.fov = +(qs.get('fov') ?? (street ? 62 : 45));
  let dist = top ? camera.position.y : undefined, ly = top ? 0 : undefined;
  if (street) {
    dist = +(qs.get('d') ?? Math.max(Math.max(size.x, size.z) * 0.8 + 25, size.y * 1.45));
    ly = +(qs.get('ty') ?? Math.min(size.y * 0.45, Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.32)) * dist));
    camera.position.set(ctr.x + Math.sin(az) * dist, +(qs.get('ey') ?? 1.3), ctr.z + Math.cos(az) * dist);
    if (qs.get('ex') !== null) camera.position.set(+qs.get('ex'), +(qs.get('ey') ?? 1.3), +qs.get('ez'));
    camera.lookAt(ctr.x, ly, ctr.z);
    // Fit every source bound in a default street study, including tall towers and long terminal wings.
    // Explicit poses stay exact for comparisons and close-up studies.
    if (qs.get('d') === null && qs.get('ex') === null) {
      for (let attempt=0;attempt<20;attempt++) {
        camera.updateMatrixWorld(); camera.updateProjectionMatrix();
        let fits=true;
        for (const x of [box.min.x,box.max.x]) for (const y of [box.min.y,box.max.y]) for (const z of [box.min.z,box.max.z]) {
          const v=new THREE.Vector3(x,y,z).project(camera); if(Math.abs(v.x)>0.94||Math.abs(v.y)>0.94||v.z>1) fits=false;
        }
        if(fits) break;
        dist*=1.1; ly=+(qs.get('ty') ?? size.y*0.45);
        camera.position.set(ctr.x+Math.sin(az)*dist,+(qs.get('ey')??1.3),ctr.z+Math.cos(az)*dist);camera.lookAt(ctr.x,ly,ctr.z);
      }
    }
  } else if (!top) {
    const el = top ? Math.PI / 2 - 0.001 : THREE.MathUtils.degToRad(+(qs.get('el') ?? 24));
    // A top camera must clear the tallest roof before fitting its horizontal extent.
    dist = +(qs.get('d') ?? (R / Math.tan(THREE.MathUtils.degToRad(22.5)) * (top ? 1.12 : 1.25) + (top ? size.y : 0)));
    ly = top ? 0 : size.y * 0.4;
    camera.position.set(ctr.x + Math.cos(el) * Math.sin(az) * dist, ly + Math.sin(el) * dist, ctr.z + Math.cos(el) * Math.cos(az) * dist);
    camera.lookAt(ctr.x, ly, ctr.z);
  }
  camera.near = street ? 0.3 : Math.max(0.5, dist / 500); camera.far = Math.max(dist, R) * 20; camera.updateProjectionMatrix();
  // sun: by default 50° to the right of the camera bearing at ~50° elevation, so the viewed facades are lit (&sun=<deg> overrides)
  const saz = qs.get('sun') !== null ? THREE.MathUtils.degToRad(+qs.get('sun')) : az + 0.87;
  sun.position.set(ctr.x + Math.sin(saz) * R * 1.6, R * 2.2, ctr.z + Math.cos(saz) * R * 1.6); sun.target.position.copy(ctr);
  const sc = sun.shadow.camera; sc.left = sc.bottom = -R * 1.6; sc.right = sc.top = R * 1.6; sc.near = 1; sc.far = R * 8; sc.updateProjectionMatrix();
  scene.traverse((o) => { if (o.material?.userData?.nightEmissive) o.material.emissiveIntensity = NIGHT ? o.material.userData.nightEmissive : 0; });
  scene.fog = lm.backdrop ? new THREE.Fog('#a9c9e6', dist * 0.2, dist * 3) : null;
  renderer.render(scene, camera);
  const info = `${lm.name} — ${current.triangles} tris${extraTris ? ' (+' + extraTris + ' with)' : ''} (scale ${current.authoredScale ?? 1}), ${current.mesh.children.length} meshes, ${current.collision.length} col boxes, h=${size.y.toFixed(1)} m, ${size.x.toFixed(0)}×${size.z.toFixed(0)} m (world), ${ms.toFixed(1)} ms`;
  document.getElementById('info').textContent = info;
  window.__stats = { id: lm.id, triangles: current.triangles, height: size.y, w: size.x, d: size.z, ms,
    drawCalls: renderer.info.render.calls, sourceIds: lm.sourceIds || [],
    pose: { position: camera.position.toArray(), up: camera.up.toArray(), quaternion: camera.quaternion.toArray(),
      projection: camera.isOrthographicCamera ? 'orthographic' : 'perspective',
      ...(top ? { groundSquareM: camera.right - camera.left, orientation: 'north-up' } : { fov: camera.fov }),
      target: [ctr.x, top ? 0 : ly, ctr.z], frame: 'isolated landmark model, +x east / +z south, metres' } };
  // Game-only overview evidence: exact camera, model bounds and current render counters.
  window.__landmarkCapture = { ...window.__stats, name: lm.name, anchor: { lat: lm.lat, lon: lm.lon, rotation: lm.rotation },
    view: top ? 'top' : street ? 'front' : 'oblique', camera: { projection: camera.isOrthographicCamera ? 'orthographic' : 'perspective', position: camera.position.toArray(), quaternion: camera.quaternion.toArray(),
      fov: camera.fov, near: camera.near, far: camera.far, viewport: [innerWidth, innerHeight] },
    bounds: { min: box.min.toArray(), max: box.max.toArray() }, collision: current.collision,
    render: { triangles: renderer.info.render.triangles, calls: renderer.info.render.calls } };
  if (!top && !qs.get('view')) history.replaceState(null, '', '?id=' + lm.id);
}
sel.onchange = () => show(sel.value);
document.getElementById('top').onchange = () => show(sel.value);
document.getElementById('col').onchange = () => { colGroup.visible = document.getElementById('col').checked; renderer.render(scene, camera); };
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); if (camera.isOrthographicCamera) { camera.right = camera.top * innerWidth / innerHeight; camera.left = -camera.right; } else camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.render(scene, camera); });
window.showLandmark = show;
window.__ids = LANDMARKS.map(l => l.id);
show(qs.get('id') || LANDMARKS[0].id);
window.__ready = true;
</script>
</body>
</html>
